name: PUMP Data Collection

on:
  schedule:
    # Hourly tracker + alerts
    - cron: '17 * * * *'
    # Price monitor every 15 min (GitHub Actions unreliable below this)
    - cron: '*/15 * * * *'
    # Daily regime model (after DefiLlama closes the previous UTC day)
    - cron: '37 6 * * *'
  workflow_dispatch: # Manual trigger

permissions:
  contents: write

jobs:
  tracker:
    if: github.event.schedule == '17 * * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: npm ci

      - name: Run tracker
        env:
          HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}
        run: node pump-tracker.js

      - name: Run alerts
        env:
          HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          # Scorer-derived notifications stay muted until re-validated (pump-walkforward.js).
          # Flip to "1" to receive tier / dip / velocity alerts again.
          SCORER_ALERTS: "0"
        run: node pump-alerts.js

      - name: Run whale tracker
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: node pump-whales.js

      - name: Commit updated data
        run: |
          git config user.name "pump-bot"
          git config user.email "pump-bot@users.noreply.github.com"
          git add pump-tracker-history.json pump-alert-state.json pump-whale-state.json pump-forecast-log.json
          git diff --staged --quiet || git commit -m "data: hourly snapshot $(date -u +%Y-%m-%dT%H:%M)"
          # the 15-min price job pushes to the same branch; rebase instead of failing
          for i in 1 2 3; do git pull --rebase -X theirs origin main && git push && break || sleep 5; done

  price-monitor:
    if: github.event.schedule == '*/15 * * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run price monitor
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: node pump-price-monitor.js

      - name: Commit price data
        run: |
          git config user.name "pump-bot"
          git config user.email "pump-bot@users.noreply.github.com"
          git add pump-price-history.json pump-price-alert-state.json
          git diff --staged --quiet || git commit -m "price: $(date -u +%Y-%m-%dT%H:%M)"
          for i in 1 2 3; do git pull --rebase -X theirs origin main && git push && break || sleep 5; done

  regime:
    if: github.event.schedule == '37 6 * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Append perps history (Hyperliquid funding/premium/candles, OKX OI)
        run: node pump-perps-history.js

      - name: Run regime model
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: node pump-regime.js

      - name: Run position framework
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: node pump-portfolio.js --quiet

      - name: Commit regime data
        run: |
          git config user.name "pump-bot"
          git config user.email "pump-bot@users.noreply.github.com"
          git add pump-regime-state.json pump-regime-log.json pump-portfolio-state.json pump-portfolio-log.json perps-history.json
          git diff --staged --quiet || git commit -m "regime: $(date -u +%Y-%m-%d)"
          for i in 1 2 3; do git pull --rebase -X theirs origin main && git push && break || sleep 5; done

  momentum:
    # independent of the tracker so a Helius failure never silences leverage setups
    if: github.event.schedule == '17 * * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run momentum setups
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: node pump-momentum.js

      - name: Commit momentum data
        run: |
          git config user.name "pump-bot"
          git config user.email "pump-bot@users.noreply.github.com"
          git add pump-momentum-state.json pump-momentum-log.json
          git diff --staged --quiet || git commit -m "momentum: $(date -u +%Y-%m-%dT%H:%M)"
          for i in 1 2 3; do git pull --rebase -X theirs origin main && git push && break || sleep 5; done
